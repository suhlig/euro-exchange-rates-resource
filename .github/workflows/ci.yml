name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    name: Test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Mirrors .pre-commit-config.yaml
      - name: go fmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run ./...

      - name: ginkgo run
        run: go tool ginkgo run -r

      - name: go fix
        run: |
          go fix ./...
          git diff --exit-code

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: gosec
        run: go tool gosec -quiet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: deadcode
        run: go tool deadcode -test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged latest
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/suhlig/euro-exchange-rates-resource:latest

      - name: Build and push image tagged with the git tag
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/suhlig/euro-exchange-rates-resource:${{ github.ref_name }}